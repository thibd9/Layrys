<title>Prisme Studio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Unbounded:wght@500;700;800&family=Cinzel:wght@600;800&family=Manrope:wght@600;700;800&display=swap">
<style>
/* Prisme: a light print studio. One working column (stage, illustration strip), one guidance column (swatch book, settings). */
:root {
  --bg: #f4f3ee; --panel: #fffefb; --panel-2: #f7f6f1; --line: #e5e3db; --line-2: #d3d0c6;
  --ink: #1b1c18; --muted: #6c6e66; --faint: #9a9c94;
  --brand: #1f3b2c; --brand-ink: #ffffff; --brand-soft: #e4ede6; --accent: #5b4fcf; --accent-soft: #ece9fb; --warn: #b4541a; --ok: #1c7c45;
  --stage: #171f1a; --stage-2: #202b23;
  --font-display: "Inter Tight", "Inter", "Segoe UI", system-ui, sans-serif;
  --font-body: "Inter", "Segoe UI", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  --radius: 14px; --radius-s: 9px; --shadow: 0 1px 2px rgba(20,22,16,.04), 0 8px 24px -16px rgba(20,22,16,.18);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #121411; --panel: #1a1d19; --panel-2: #20241f; --line: #2a2e28; --line-2: #3a3f37; --ink: #ecede8; --muted: #a0a39a; --faint: #6f726a; --brand: #cfe3d4; --brand-ink: #10201a; --brand-soft: #243328; --accent: #a79dff; --accent-soft: #2a2746; --stage: #0c0f0d; --stage-2: #151a16; color-scheme: dark; }
}
:root[data-theme="dark"] { --bg: #121411; --panel: #1a1d19; --panel-2: #20241f; --line: #2a2e28; --line-2: #3a3f37; --ink: #ecede8; --muted: #a0a39a; --faint: #6f726a; --brand: #cfe3d4; --brand-ink: #10201a; --brand-soft: #243328; --accent: #a79dff; --accent-soft: #2a2746; --stage: #0c0f0d; --stage-2: #151a16; color-scheme: dark; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { height: 100%; }
body { margin: 0; min-height: 100%; background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 14px; line-height: 1.45; -webkit-font-smoothing: antialiased; padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
button, select, input, textarea { font: inherit; color: inherit; }
h1, h2, h3 { margin: 0; font-family: var(--font-display); letter-spacing: -0.02em; text-wrap: balance; }
h1 { font-size: clamp(34px, 4.6vw, 54px); font-weight: 800; line-height: 1; letter-spacing: -0.035em; }
h2 { font-size: 19px; font-weight: 700; }
h3 { font-size: 14px; font-weight: 700; }
p { margin: 0; }
a { color: var(--accent); }
.note { font-size: 12.5px; color: var(--muted); max-width: 60ch; }
.kicker { font-family: var(--font-mono); font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin: 0 0 8px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.grow { flex: 1 1 auto; min-width: 0; }
input[type="file"] { position: absolute; width: 1px; height: 1px; opacity: 0; overflow: hidden; pointer-events: none; }
select, input[type="search"], input[type="text"], input[type="number"], textarea { background: var(--panel); border: 1px solid var(--line-2); border-radius: var(--radius-s); padding: 8px 10px; min-width: 0; width: 100%; }
input[type="color"] { width: 36px; height: 30px; padding: 0; border: 1px solid var(--line-2); border-radius: 7px; background: var(--panel); cursor: pointer; }
label.field { display: grid; gap: 4px; font-size: 12px; color: var(--muted); font-weight: 500; }
label.check { display: inline-flex; gap: 7px; align-items: center; font-size: 13px; color: var(--ink); white-space: nowrap; cursor: pointer; }
.slider { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; align-items: center; font-size: 13px; font-weight: 600; }
.slider output { font-family: var(--font-mono); font-size: 12px; font-weight: 500; color: var(--muted); font-variant-numeric: tabular-nums; }
.slider input { grid-column: 1 / -1; width: 100%; accent-color: var(--brand); margin: 2px 0 0; }
.slider.small { font-size: 12px; font-weight: 500; color: var(--muted); }
.kv { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 12px; }
.btn { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; padding: 9px 14px; border-radius: 10px; border: 1px solid var(--line-2); background: var(--panel); font-weight: 600; font-size: 13.5px; white-space: nowrap; color: var(--ink); }
.btn:hover { background: var(--panel-2); }
.btn.primary { background: var(--brand); color: var(--brand-ink); border-color: transparent; }
.btn.primary:hover { filter: brightness(1.08); }
.btn.accent { background: var(--accent); color: #fff; border-color: transparent; }
.btn.small { padding: 6px 10px; font-size: 12.5px; }
.btn.icon { padding: 7px 9px; }
.btn[aria-pressed="true"] { border-color: var(--ink); }
.link-btn { background: none; border: 0; padding: 4px 6px; cursor: pointer; font-weight: 600; font-size: 13px; color: var(--ink); border-radius: 7px; display: inline-flex; align-items: center; gap: 6px; }
.link-btn:hover { background: var(--panel-2); }
.link-btn.muted { color: var(--muted); font-weight: 500; }
.link { background: none; border: 0; padding: 0; color: var(--accent); text-decoration: underline; text-underline-offset: 2px; cursor: pointer; font-size: inherit; }
.seg { display: inline-flex; background: var(--panel-2); border: 1px solid var(--line); border-radius: 9px; padding: 3px; gap: 2px; }
.seg button { border: 0; background: transparent; padding: 5px 11px; border-radius: 7px; cursor: pointer; font-weight: 600; font-size: 12.5px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--panel); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
.pills { display: flex; flex-wrap: wrap; gap: 6px; }
.pill { border: 1px solid var(--line-2); background: var(--panel); color: var(--muted); border-radius: 999px; padding: 6px 12px; font-size: 12.5px; font-weight: 600; cursor: pointer; }
.pill:hover { background: var(--panel-2); color: var(--ink); }
.pill[aria-pressed="true"] { background: var(--brand); color: var(--brand-ink); border-color: transparent; }
.chip { border: 1px solid var(--line-2); background: var(--panel); color: var(--ink); border-radius: 9px; padding: 7px 12px; font-size: 13px; font-weight: 600; cursor: pointer; display: inline-flex; gap: 6px; align-items: center; }
.chip:hover { background: var(--panel-2); }
.chip[aria-pressed="true"] { background: var(--brand-soft); border-color: var(--brand); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
button:focus-visible, select:focus-visible, input:focus-visible, textarea:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.swatches { display: inline-flex; gap: 4px; }
.swatch { display: inline-block; width: 20px; height: 20px; border-radius: 5px; border: 1px solid var(--line-2); }
.badge { font-family: var(--font-mono); font-size: 11px; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 3px 9px; white-space: nowrap; }
.badge.ok { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 40%, transparent); }
.badge.warn { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 40%, transparent); }
details.disc { border-top: 1px solid var(--line); }
details.disc > summary { list-style: none; cursor: pointer; padding: 12px 0; font-weight: 600; font-size: 13.5px; display: flex; align-items: center; gap: 8px; }
details.disc > summary::-webkit-details-marker { display: none; }
details.disc > summary::after { content: "→"; margin-left: auto; color: var(--muted); transition: transform .15s; }
details.disc[open] > summary::after { transform: rotate(90deg); }
details.disc > .inner { display: grid; gap: 12px; padding: 0 0 14px; }
.menu { position: relative; }
.menu__list { position: absolute; top: calc(100% + 6px); right: 0; z-index: 40; min-width: 230px; max-height: min(70vh, 520px); overflow-y: auto; overscroll-behavior: contain; background: var(--panel); border: 1px solid var(--line-2); border-radius: 12px; padding: 6px; box-shadow: 0 14px 40px -14px rgba(0,0,0,.35); display: grid; gap: 2px; }
.menu__list.left { right: auto; left: 0; }
.menu__list button, .menu__list label { display: flex; gap: 10px; align-items: center; text-align: left; width: 100%; border: 0; background: none; padding: 9px 10px; border-radius: 8px; cursor: pointer; font-size: 13.5px; font-weight: 500; color: var(--ink); }
.menu__list button:hover, .menu__list label:hover { background: var(--panel-2); }
.menu__list button[aria-pressed="true"] { background: var(--brand-soft); }
.menu__list .sep { height: 1px; background: var(--line); margin: 4px 2px; }
.menu__list small { color: var(--muted); margin-left: auto; font-family: var(--font-mono); font-size: 11px; }
.pop { position: absolute; top: calc(100% + 8px); right: 0; z-index: 45; width: min(440px, 92vw); background: var(--panel); border: 1px solid var(--line-2); border-radius: 14px; padding: 14px; box-shadow: 0 18px 50px -16px rgba(0,0,0,.35); display: grid; gap: 12px; text-align: left; }

/* ---------- top bar and page head ---------- */
.app { max-width: 1480px; margin: 0 auto; padding: 0 20px 40px; }
.top { position: sticky; top: 0; z-index: 30; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 22px; padding: 12px 20px; margin: 0 -20px 10px; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.logo { display: inline-flex; align-items: center; gap: 9px; font-family: var(--font-display); font-weight: 700; font-size: 19px; letter-spacing: -0.02em; text-decoration: none; color: var(--ink); }
.logo .mark { width: 22px; height: 22px; background: conic-gradient(from 210deg, #1f3b2c, #5b4fcf, #e0b24a, #1f3b2c); clip-path: polygon(50% 0, 100% 80%, 50% 100%, 0 80%); display: inline-block; }
.nav { display: flex; gap: 4px; }
.nav button { border: 0; background: none; padding: 9px 10px; font-weight: 600; font-size: 14px; color: var(--muted); cursor: pointer; border-bottom: 2px solid transparent; }
.nav button[aria-pressed="true"] { color: var(--ink); border-bottom-color: var(--ink); }
.top__right { margin-left: auto; display: flex; align-items: center; gap: 6px; }
.top__right .sep { width: 1px; height: 22px; background: var(--line-2); margin: 0 6px; }
.page-head { display: flex; flex-wrap: wrap; gap: 16px 24px; align-items: flex-end; justify-content: space-between; margin: 10px 0 18px; }
.crumb { font-family: var(--font-mono); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.crumb::before { content: ""; width: 18px; height: 2px; background: var(--warn); }
.page-head .sub { color: var(--muted); margin-top: 8px; font-size: 14.5px; }
.meta-row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.meta { position: relative; display: grid; gap: 2px; padding: 8px 12px; border-left: 1px solid var(--line-2); }
.meta .lbl { font-family: var(--font-mono); font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.meta .val { background: none; border: 0; padding: 0; font-family: var(--font-display); font-weight: 700; font-size: 20px; cursor: pointer; display: inline-flex; gap: 6px; align-items: baseline; letter-spacing: -0.02em; }
.meta .val small { font-size: 12px; font-weight: 600; color: var(--muted); }
.meta .val::after { content: "⌄"; font-size: 13px; color: var(--muted); }
.format-btn { position: relative; }
.format-btn > button { display: inline-flex; align-items: center; gap: 8px; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line-2); background: var(--panel); font-weight: 600; font-size: 14px; cursor: pointer; box-shadow: var(--shadow); }
.format-btn > button::after { content: "⌄"; color: var(--muted); }
.format-btn .glyph { width: 12px; height: 16px; border: 1.5px solid var(--ink); border-radius: 2px; display: inline-block; }

/* ---------- layout ---------- */
.page { display: grid; gap: 18px; }
.cols { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(360px, 0.95fr); gap: 20px; align-items: start; }
@media (max-width: 1080px) { .cols { grid-template-columns: minmax(0, 1fr); } }
.col { display: grid; gap: 18px; min-width: 0; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); min-width: 0; }
.panel__in { padding: 18px 20px; display: grid; gap: 12px; }
.panel__bar { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; justify-content: space-between; padding: 12px 16px; }
.panel__bar + .stage { border-top: 1px solid var(--line); }
.panel__foot { display: flex; flex-wrap: wrap; gap: 8px; justify-content: space-between; align-items: center; padding: 10px 14px; border-top: 1px solid var(--line); background: var(--panel-2); border-radius: 0 0 var(--radius) var(--radius); }

/* ---------- stage ---------- */
.stage { position: relative; min-height: 640px; display: grid; place-items: center; overflow: hidden; touch-action: none; background-color: var(--stage); background-image: radial-gradient(rgba(255,255,255,.07) 1px, transparent 1.2px), radial-gradient(circle at 50% 35%, var(--stage-2), var(--stage) 70%); background-size: 22px 22px, 100% 100%; }
@media (max-width: 760px) { .stage { min-height: 500px; } }
.stage.dropping { outline: 2px dashed var(--accent); outline-offset: -10px; }
.stage.picking { cursor: crosshair; }
.stage.brushing { cursor: cell; }
.stage.panning { cursor: grab; }
.stage__tag { position: absolute; left: 14px; top: 14px; z-index: 5; display: inline-flex; align-items: center; gap: 8px; padding: 7px 11px; border-radius: 9px; background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.14); color: #f1f2ee; font-size: 12.5px; font-weight: 600; backdrop-filter: blur(6px); max-width: 60%; }
.stage__tag i { width: 8px; height: 8px; border-radius: 50%; background: #e0b24a; flex: none; }
.stage__tag span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stage__light { position: absolute; right: 14px; top: 14px; z-index: 6; }
.stage__light .menu__list { max-height: min(560px, calc(100vh - 220px)); }
.stage__light > button { display: inline-flex; align-items: center; gap: 7px; padding: 7px 11px; border-radius: 9px; background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.14); color: #f1f2ee; font-size: 12.5px; font-weight: 600; cursor: pointer; backdrop-filter: blur(6px); }
.stage__info { position: absolute; left: 16px; bottom: 12px; font-family: var(--font-mono); font-size: 11px; letter-spacing: .06em; color: rgba(255,255,255,.55); pointer-events: none; z-index: 3; text-transform: uppercase; }
.stage__hint { position: absolute; right: 16px; bottom: 12px; font-size: 12px; color: rgba(255,255,255,.55); pointer-events: none; z-index: 3; }
@media (max-width: 600px) { .stage__hint, .stage__tag { display: none; } }
.nogl { position: absolute; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; color: #fff; z-index: 5; }
.scene-canvas { display: block; width: 100%; max-width: 980px; height: auto; transform: translateZ(1px); }
.stagewrap { transform-origin: center; will-change: transform; display: grid; place-items: center; width: 100%; }
.tilt { perspective: 1100px; width: 100%; display: grid; place-items: center; }
.tilt__in { transform: rotateY(var(--rotate-x, 0deg)) rotateX(var(--rotate-y, 0deg)); transform-style: preserve-3d; will-change: transform; display: grid; place-items: center; position: relative; width: 100%; }
.card { position: relative; width: var(--card-w, 380px); aspect-ratio: var(--card-aspect, 0.716); max-width: 100%; user-select: none; -webkit-user-select: none; transform-style: preserve-3d; --thick: 2px; }
.card__flip { position: absolute; inset: 0; transform-style: preserve-3d; transition: transform .8s cubic-bezier(.35,.1,.2,1); transform: rotateY(var(--flip, 0deg)); }
@media (prefers-reduced-motion: reduce) { .card__flip { transition: none; } }
.face { position: absolute; inset: 0; border-radius: var(--card-radius, 4.6% / 3.3%); overflow: hidden; background: #000; backface-visibility: hidden; -webkit-backface-visibility: hidden; box-shadow: 0 30px 60px -22px rgba(0,0,0,.95), 0 8px 18px -8px rgba(0,0,0,.8); }
.face.front { transform: translateZ(calc(var(--thick) / 2)); }
.face.back { transform: rotateY(180deg) translateZ(calc(var(--thick) / 2)); }
.core { position: absolute; inset: 0; border-radius: var(--card-radius, 4.6% / 3.3%); background: var(--core-color, #26262b); transform: translateZ(0); }
.face canvas { display: block; width: 100%; height: 100%; pointer-events: none; }
.card__edge { position: absolute; inset: 0; border-radius: inherit; pointer-events: none; box-shadow: inset 0 0 0 1px rgba(255,255,255,0.12), inset 0 0 12px rgba(0,0,0,0.3); }
.card.edge-gold .card__edge { box-shadow: inset 0 0 0 2px #e8b44a, inset 0 0 0 3px rgba(120,80,0,.7), inset 0 0 14px rgba(0,0,0,.35); }
.card.edge-silver .card__edge { box-shadow: inset 0 0 0 2px #d9dde6, inset 0 0 0 3px rgba(60,60,70,.7), inset 0 0 14px rgba(0,0,0,.35); }
.card.edge-black .card__edge { box-shadow: inset 0 0 0 3px #0b0b0d, inset 0 0 14px rgba(0,0,0,.5); }
.card.edge-red .card__edge { box-shadow: inset 0 0 0 2px #e23b3b, inset 0 0 0 3px rgba(90,0,0,.7), inset 0 0 14px rgba(0,0,0,.35); }
.marks { position: absolute; left: calc(var(--mark-px, 0px) * -1); top: calc(var(--mark-px, 0px) * -1); width: calc(100% + 2 * var(--mark-px, 0px)); height: calc(100% + 2 * var(--mark-px, 0px)); pointer-events: none; display: none; overflow: visible; z-index: 4; transform: translateZ(3px); }
.card.show-marks .marks { display: block; }
.brush-cursor { position: absolute; z-index: 7; pointer-events: none; border: 1.5px solid #fff; border-radius: 50%; mix-blend-mode: difference; transform: translate(-50%, -50%); display: none; }
.stage.brushing .brush-cursor { display: block; }
.tools { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; padding: 10px 14px; border-top: 1px solid var(--line); }
.tools .spacer { flex: 1; }
.angle { display: inline-flex; align-items: center; border: 1px solid var(--line-2); border-radius: 9px; overflow: hidden; }
.angle button { border: 0; background: none; padding: 6px 10px; cursor: pointer; font-size: 14px; }
.angle span { font-weight: 600; font-size: 13px; padding: 0 6px; min-width: 90px; text-align: center; }
.zoombar { display: inline-flex; align-items: center; gap: 2px; }
.zoombar button { border: 0; background: none; width: 30px; height: 30px; border-radius: 8px; cursor: pointer; font-size: 16px; display: grid; place-items: center; }
.zoombar button:hover { background: var(--panel-2); }
.zoombar button[aria-pressed="true"] { background: var(--brand-soft); }
.zoombar output { font-family: var(--font-mono); font-size: 12px; min-width: 50px; text-align: center; }
.views { display: flex; flex-wrap: wrap; gap: 6px; padding: 10px 14px; border-top: 1px solid var(--line); }
.views button { border: 1px solid transparent; background: none; padding: 7px 12px; border-radius: 9px; cursor: pointer; font-weight: 600; font-size: 13px; color: var(--muted); display: inline-flex; gap: 6px; align-items: center; }
.views button:hover { background: var(--panel-2); color: var(--ink); }
.views button[aria-pressed="true"] { background: var(--brand); color: var(--brand-ink); }

/* ---------- illustration strip ---------- */
.lib__strip { display: flex; gap: 10px; overflow-x: auto; padding: 4px 16px 16px; scroll-snap-type: x proximity; }
.lib__item { position: relative; flex: 0 0 auto; width: 170px; aspect-ratio: 16 / 9; border-radius: 9px; overflow: hidden; border: 2px solid var(--line); background: var(--panel-2) center / cover no-repeat; cursor: pointer; padding: 0; scroll-snap-align: start; }
.lib__item[aria-pressed="true"] { border-color: var(--brand); }
.lib__item[aria-pressed="true"]::after { content: "✓"; position: absolute; right: 6px; bottom: 6px; width: 20px; height: 20px; border-radius: 50%; background: var(--brand); color: var(--brand-ink); font-size: 12px; display: grid; place-items: center; }
.lib__item.off { opacity: .45; }
.lib__item b { position: absolute; left: 0; right: 0; bottom: 0; padding: 4px 8px; font-size: 11px; font-weight: 600; color: #fff; background: linear-gradient(transparent, rgba(0,0,0,.65)); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: left; }
.lib__item.add { display: grid; place-items: center; border-style: dashed; color: var(--muted); font-weight: 600; font-size: 13px; background: var(--panel); }
.lib__plus { position: absolute; left: 6px; top: 6px; width: 22px; height: 22px; border-radius: 50%; background: rgba(0,0,0,.55); color: #fff; display: grid; place-items: center; font-weight: 700; font-size: 15px; line-height: 1; }
.lib__plus:hover { background: var(--brand); }
.lib__fit { padding: 0 16px 16px; display: grid; gap: 10px; }

/* ---------- swatch book ---------- */
.fxgrid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 480px) { .fxgrid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.fx { position: relative; display: grid; gap: 0; padding: 0; border: 1.5px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--panel); cursor: pointer; text-align: left; }
.fx:hover { border-color: var(--line-2); }
.fx[aria-pressed="true"] { border-color: var(--brand); }
.fx[aria-pressed="true"]::after { content: "✓"; position: absolute; right: 7px; top: 7px; width: 20px; height: 20px; border-radius: 50%; background: var(--brand); color: var(--brand-ink); font-size: 12px; display: grid; place-items: center; }
.fx img { width: 100%; aspect-ratio: 3 / 2; object-fit: cover; object-position: 50% 28%; display: block; background: linear-gradient(135deg, var(--panel-2), var(--line)); }

/* ---------- protections: a solid body behind the card, a recess around it, a glass layer above ---------- */
.protect { position: relative; display: grid; place-items: center; width: fit-content; max-width: 100%; }

.protect .shell-recess { z-index: 0; display: none; }

/* ---------- packaging scene ---------- */
.pack-scene { width: 100%; min-height: 560px; display: grid; place-items: center; perspective: 1400px; position: relative; }

.booster { position: relative; width: var(--bw, 230px); height: var(--bh, 400px); transform-style: preserve-3d; }
