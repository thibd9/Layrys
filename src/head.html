<title>Layrys Studio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Figtree:wght@400;500;600;700&family=Unbounded:wght@500;700;800&family=Cinzel:wght@600;800&family=Manrope:wght@600;700;800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layrys Studio v12. A finishing workshop: ink-black rail, paper work surface, the orange of the mark for selection,
   one colour per print process. Light and dark share every component; only the tokens change. */
:root {
  --bg: #f2f0ea; --surface: #ffffff; --surface-2: #f7f5f0; --surface-3: #eeebe3; --line: #e3dfd4; --line-2: #cfc9bb;
  --ink: #18160f; --muted: #645e51; --faint: #8f897b;
  --sel: #e2590a; --sel-soft: #fff0e0; --sel-ink: #8a3400;
  --hot: linear-gradient(135deg, #ff6a00 0%, #ff961f 55%, #ffc24a 100%); --hot-ink: #261200;
  --rail: #17150f; --rail-ink: #f4f1ea; --rail-muted: #a8a294; --rail-line: #2e2b22;
  --stage: #dcd9d1; --stage-2: #efede7; --stage-ink: #26231b; --stage-muted: #6a655a; --stage-chip: rgba(255,255,255,.72); --stage-line: rgba(24,22,15,.12); --stage-dot: rgba(24,22,15,.07);
  --ok: #1c8048; --ok-soft: #e2f4e8; --warn: #b85f00; --warn-soft: #fdeed7; --err: #c2372a; --err-soft: #fbe5e1;
  --p-foil: #c08a1e; --p-holo: #7a5cf0; --p-varnish: #1e9bb0; --p-emboss: #6f7a8c; --p-ink: #d23c97; --p-none: #9a9486;
  --shadow: 0 1px 2px rgba(30,24,10,.05), 0 6px 18px -10px rgba(30,24,10,.18); --shadow-pop: 0 2px 4px rgba(30,24,10,.06), 0 18px 44px -14px rgba(30,24,10,.32);
  --radius: 12px; --radius-s: 8px;
  --font-display: "Sora", "Figtree", "Segoe UI", system-ui, sans-serif; --font-body: "Figtree", "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
}
/*DARK{*/
  --bg: #0e0e10; --surface: #18181b; --surface-2: #1f1f23; --surface-3: #27272c; --line: #2d2d33; --line-2: #3d3d45;
  --ink: #f3f1ea; --muted: #aaa69b; --faint: #7b786f;
  --sel: #ff8a2b; --sel-soft: #2f1f10; --sel-ink: #ffc28a;
  --rail: #09090a; --rail-ink: #f3f1ea; --rail-muted: #8f8b81; --rail-line: #232327;
  --stage: #09090b; --stage-2: #1b1b20; --stage-ink: #ecebe6; --stage-muted: #9a978e; --stage-chip: rgba(255,255,255,.09); --stage-line: rgba(255,255,255,.13); --stage-dot: rgba(255,255,255,.06);
  --ok: #4fc784; --ok-soft: #13291c; --warn: #f0a544; --warn-soft: #2e2110; --err: #ff7466; --err-soft: #331613;
  --p-foil: #e2b250; --p-holo: #a08bff; --p-varnish: #4cc3d6; --p-emboss: #98a3b5; --p-ink: #f06cba; --p-none: #77746c;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 20px -12px rgba(0,0,0,.7); --shadow-pop: 0 2px 4px rgba(0,0,0,.4), 0 20px 46px -14px rgba(0,0,0,.85);
  color-scheme: dark;
/*}DARK*/
:root[data-font="rounded"] { --font-display: "Outfit", "Segoe UI", system-ui, sans-serif; --font-body: "Outfit", "Segoe UI", system-ui, sans-serif; }
:root[data-font="editorial"] { --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif; --font-body: "Instrument Sans", "Segoe UI", system-ui, sans-serif; }
:root[data-font="classic"] { --font-display: "DM Sans", "Segoe UI", system-ui, sans-serif; --font-body: "DM Sans", "Segoe UI", system-ui, sans-serif; }
:root[data-font="system"] { --font-display: system-ui, "Segoe UI", sans-serif; --font-body: system-ui, "Segoe UI", sans-serif; }

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { height: 100%; scrollbar-color: var(--line-2) transparent; scrollbar-width: thin; }
body { margin: 0; min-height: 100%; background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 13.5px; line-height: 1.45; -webkit-font-smoothing: antialiased; font-variant-numeric: tabular-nums; }
::selection { background: var(--sel); color: #fff; }
::-webkit-scrollbar { width: 10px; height: 10px; } ::-webkit-scrollbar-thumb { background: var(--line-2); border-radius: 10px; border: 2px solid transparent; background-clip: padding-box; } ::-webkit-scrollbar-track { background: transparent; }
button, select, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--sel); outline-offset: 2px; }
h1, h2, h3 { margin: 0; font-family: var(--font-display); letter-spacing: -0.015em; text-wrap: balance; }
h1 { font-size: 17px; font-weight: 600; line-height: 1.2; }
h2 { font-size: 14.5px; font-weight: 600; }
h3 { font-size: 13px; font-weight: 600; }
p { margin: 0; }
a { color: var(--sel); text-underline-offset: 3px; }
svg.ic { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
svg.ic.s { width: 15px; height: 15px; }
.note { font-size: 12.5px; color: var(--muted); max-width: 68ch; }
.q { font-family: var(--font-display); font-size: 12.5px; font-weight: 600; margin: 6px 0 0; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.grow { flex: 1 1 auto; min-width: 0; } .spacer { flex: 1 1 auto; }
input[type="file"] { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
select, input[type="search"], input[type="text"], input[type="number"], textarea { width: 100%; background: var(--surface); border: 1px solid var(--line-2); border-radius: var(--radius-s); padding: 7px 10px; min-height: 34px; caret-color: var(--sel); transition: border-color .15s; }
select:hover, input:hover, textarea:hover { border-color: var(--faint); }
select:focus, input:focus, textarea:focus { outline: none; border-color: var(--sel); box-shadow: 0 0 0 3px color-mix(in srgb, var(--sel) 22%, transparent); }
textarea { resize: vertical; min-height: 58px; }
input[type="color"] { width: 100%; height: 34px; padding: 2px; border: 1px solid var(--line-2); border-radius: var(--radius-s); background: var(--surface); }
input[type="range"] { -webkit-appearance: none; appearance: none; width: 100%; height: 18px; background: transparent; margin: 0; cursor: pointer; border: 0; padding: 0; min-height: 0; box-shadow: none; }
input[type="range"]::-webkit-slider-runnable-track { height: 4px; border-radius: 4px; background: var(--line-2); }
input[type="range"]::-moz-range-track { height: 4px; border-radius: 4px; background: var(--line-2); }
input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px; margin-top: -6px; border-radius: 50%; background: var(--surface); border: 2px solid var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.25); transition: transform .12s; }
input[type="range"]::-moz-range-thumb { width: 13px; height: 13px; border-radius: 50%; background: var(--surface); border: 2px solid var(--ink); }
input[type="range"]:hover::-webkit-slider-thumb, input[type="range"]:focus-visible::-webkit-slider-thumb { transform: scale(1.15); border-color: var(--sel); }
input[type="checkbox"] { accent-color: var(--sel); width: 15px; height: 15px; margin: 0; }
.field { display: grid; gap: 4px; font-size: 12px; font-weight: 500; color: var(--muted); min-width: 0; }
.kv { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 12px; align-items: end; }
.slider { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 8px; align-items: center; font-size: 13px; font-weight: 500; }
.slider input { grid-column: 1 / -1; }
.slider > span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.slider output { font-size: 12px; color: var(--muted); }
.slider.small { font-size: 12px; color: var(--muted); font-weight: 500; }
.check { display: inline-flex; gap: 7px; align-items: center; font-size: 12.5px; cursor: pointer; }
.sep { width: 1px; align-self: stretch; background: var(--line); margin: 0 2px; }
.badge { font-size: 11.5px; font-weight: 600; color: var(--muted); border: 1px solid var(--line-2); border-radius: 999px; padding: 2px 9px; white-space: nowrap; }
.badge.ok { color: var(--ok); border-color: transparent; background: var(--ok-soft); } .badge.warn { color: var(--warn); border-color: transparent; background: var(--warn-soft); }
kbd { font-family: var(--font-body); font-size: 11px; font-weight: 600; border: 1px solid var(--line-2); border-bottom-width: 2px; border-radius: 5px; padding: 1px 5px; background: var(--surface-2); color: var(--ink); }

/* buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-height: 34px; padding: 6px 13px; border-radius: var(--radius-s); border: 1px solid var(--line-2); background: var(--surface); font-weight: 600; font-size: 13px; transition: background .15s, border-color .15s, transform .08s; white-space: nowrap; }
.btn:hover { background: var(--surface-2); border-color: var(--faint); } .btn:active { transform: translateY(1px); }
.btn:disabled { opacity: .45; cursor: default; }
.btn.primary { background: var(--hot); border-color: transparent; color: var(--hot-ink); box-shadow: 0 1px 0 rgba(255,255,255,.35) inset, 0 6px 14px -8px #ff7a10; }
.btn.primary:hover { filter: brightness(1.05); }
.btn.accent { background: var(--ink); border-color: var(--ink); color: var(--bg); } .btn.accent:hover { opacity: .9; }
.btn.small { min-height: 28px; padding: 3px 10px; font-size: 12.5px; }
.btn[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.btn.icon { width: 34px; padding: 0; } .btn.ghost { border-color: transparent; background: transparent; } .btn.ghost:hover { background: var(--surface-3); }
.link-btn { display: inline-flex; align-items: center; gap: 6px; background: none; border: 0; padding: 4px 6px; border-radius: 6px; font-weight: 600; font-size: 12.5px; color: var(--ink); cursor: pointer; }
.link-btn:hover { background: var(--surface-3); } .link-btn.muted { color: var(--muted); font-weight: 500; }
.link { background: none; border: 0; padding: 0; color: var(--sel); font-weight: 600; text-decoration: underline; text-underline-offset: 3px; }
.seg { display: inline-flex; background: var(--surface-3); border-radius: 9px; padding: 3px; gap: 2px; max-width: 100%; overflow-x: auto; scrollbar-width: none; }
.seg button { border: 0; background: transparent; padding: 5px 11px; border-radius: 7px; font-weight: 600; font-size: 12.5px; color: var(--muted); white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; }
.seg button:hover { color: var(--ink); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.14); }
.pills, .chips { display: flex; flex-wrap: wrap; gap: 6px; }
.pill, .chip { border: 1px solid var(--line-2); background: var(--surface); border-radius: 999px; padding: 5px 12px; font-size: 12.5px; font-weight: 600; color: var(--ink); display: inline-flex; align-items: center; gap: 6px; transition: background .15s, border-color .15s; }
.pill:hover, .chip:hover { border-color: var(--faint); background: var(--surface-2); }
.pill[aria-pressed="true"], .chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.chip.tool { border-style: dashed; }
.chip.tool[aria-pressed="true"] { border-style: solid; background: var(--sel); border-color: var(--sel); color: #fff; }

/* menus and popovers */
.menu { position: relative; display: inline-flex; }
.menu__list, .pop { position: absolute; z-index: 40; top: calc(100% + 6px); right: 0; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow-pop); }
.menu__list { min-width: 250px; padding: 6px; display: grid; gap: 1px; max-height: min(560px, calc(100dvh - 120px)); overflow: auto; }
.menu__list.left, .pop.left { right: auto; left: 0; }
.menu__list > button, .menu__list > label { display: flex; align-items: center; gap: 9px; text-align: left; border: 0; background: none; padding: 8px 10px; border-radius: 7px; font-size: 13px; font-weight: 500; cursor: pointer; }
.menu__list > button:hover, .menu__list > label:hover { background: var(--surface-3); }
.menu__list > button[aria-pressed="true"] { background: var(--sel-soft); color: var(--sel-ink); font-weight: 600; }
.menu__list small { color: var(--muted); margin-left: auto; font-size: 11.5px; padding-left: 12px; }
.menu__list .sep { height: 1px; width: auto; margin: 4px 6px; }
.pop { width: min(380px, calc(100vw - 32px)); padding: 14px; display: grid; gap: 10px; }
.help-pop { width: min(680px, calc(100vw - 110px)); max-height: min(78dvh, 720px); overflow: auto; }
.help-pop h3 { margin-top: 10px; }
.keys { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 7px 14px; font-size: 12.5px; color: var(--muted); }
.ref-wrap { overflow-x: auto; max-width: 100%; }
table.ref { border-collapse: collapse; width: 100%; font-size: 12px; }
table.ref th { text-align: left; font-weight: 600; color: var(--muted); padding: 5px 8px; border-bottom: 1px solid var(--line-2); white-space: nowrap; }
table.ref td { padding: 5px 8px; border-bottom: 1px solid var(--line); } table.ref td.mono { white-space: nowrap; color: var(--muted); }
.glossary { display: grid; gap: 8px; }
.glossary .g { padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface-2); }
.glossary .g > b { display: block; font-family: var(--font-display); font-size: 13px; margin-bottom: 3px; }
.glossary .g p { font-size: 12.5px; color: var(--muted); margin-top: 4px; }
.glossary .g .tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
.glossary .pill { font-size: 11.5px; padding: 3px 9px; }
.theme-seg { display: grid; grid-template-columns: repeat(3, 1fr); } .theme-seg button { justify-content: center; }
.fontlist { display: grid; gap: 4px; }
.fontlist button { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 8px 10px; text-align: left; }
.fontlist button b { font-size: 14px; font-weight: 600; } .fontlist button span { font-size: 11.5px; color: var(--muted); }
.fontlist button[aria-pressed="true"] { border-color: var(--sel); background: var(--sel-soft); }

/* shell */
.app { display: grid; grid-template-columns: 76px minmax(0, 1fr); min-height: 100dvh; }
.rail { position: sticky; top: 0; height: 100dvh; background: var(--rail); color: var(--rail-ink); display: flex; flex-direction: column; align-items: center; padding: 12px 0 10px; gap: 14px; z-index: 30; }
.logo { display: grid; place-items: center; text-decoration: none; }
.logo__tile { width: 42px; height: 42px; border-radius: 12px; background: var(--hot); display: grid; place-items: center; box-shadow: 0 6px 16px -8px #ff7a10; }
.logo__tile svg { width: 23px; height: 26px; }
.nav { display: grid; gap: 4px; width: 100%; padding: 0 7px; }
.nav button { display: grid; justify-items: center; gap: 4px; border: 0; background: none; color: var(--rail-muted); padding: 9px 2px 8px; border-radius: 10px; font-size: 10.5px; font-weight: 600; letter-spacing: .01em; position: relative; transition: color .15s, background .15s; }
.nav button svg { width: 21px; height: 21px; }
.nav button:hover { color: var(--rail-ink); background: rgba(255,255,255,.06); }
.nav button[aria-pressed="true"] { color: #fff; background: rgba(255,255,255,.1); }
.nav button[aria-pressed="true"]::before { content: ""; position: absolute; left: -7px; top: 10px; bottom: 10px; width: 3px; border-radius: 0 3px 3px 0; background: var(--hot); }
.rail__foot { margin-top: auto; display: grid; gap: 4px; justify-items: center; }
.rail__foot > .menu > button { width: 40px; height: 40px; border-radius: 10px; border: 0; background: none; color: var(--rail-muted); display: grid; place-items: center; }
.rail__foot > .menu > button:hover { color: var(--rail-ink); background: rgba(255,255,255,.08); }
.rail .pop, .rail .menu__list { left: calc(100% + 10px); right: auto; top: auto; bottom: 0; color: var(--ink); }
.main { min-width: 0; display: flex; flex-direction: column; }
.top { position: sticky; top: 0; z-index: 25; display: flex; align-items: center; gap: 14px; padding: 9px 20px; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); min-height: 56px; }
.logo__word { height: 14px; width: auto; color: var(--ink); flex: none; }
.top__title { min-width: 0; display: grid; gap: 1px; padding-left: 14px; border-left: 1px solid var(--line-2); }
.top__title p { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.top__right { margin-left: auto; display: flex; align-items: center; gap: 8px; flex: none; }
.spec { display: inline-flex; align-items: center; gap: 8px; min-height: 34px; padding: 4px 11px; border-radius: var(--radius-s); border: 1px solid var(--line-2); background: var(--surface); font-weight: 600; font-size: 12.5px; }
.spec:hover { border-color: var(--faint); }
.spec small { font-weight: 500; color: var(--muted); font-size: 11.5px; }
.spec .glyph { width: 11px; height: 15px; border: 1.6px solid currentColor; border-radius: 2.5px; flex: none; }
#saveState { font-size: 11.5px; color: var(--muted); white-space: nowrap; max-width: 210px; overflow: hidden; text-overflow: ellipsis; }
.page { padding: 16px 20px 40px; display: grid; gap: 16px; align-content: start; }
.work { display: grid; grid-template-columns: minmax(0, 1fr) 408px; gap: 16px; align-items: start; }
.work__main, .col { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; min-width: 0; align-content: start; }
.duo { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 16px; align-items: start; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); min-width: 0; }
.panel__bar { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; justify-content: space-between; padding: 10px 14px; min-height: 48px; }
.panel__bar h2 { display: flex; align-items: center; gap: 8px; } .panel__bar h2 .note { font-family: var(--font-body); font-weight: 500; }
.panel__in { padding: 14px; display: grid; gap: 12px; }
.panel__foot { padding: 9px 14px; border-top: 1px solid var(--line); display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; }
.insp { position: sticky; top: 72px; max-height: calc(100dvh - 88px); display: flex; flex-direction: column; overflow: hidden; }
.insp__head { padding: 14px 14px 12px; display: grid; gap: 8px; border-bottom: 1px solid var(--line); }
.fx-title { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
.fx-title h2 { font-size: 16px; }
.fx-sub { font-size: 12px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; }
.proc-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--p-none); flex: none; display: inline-block; }
.proc-dot.foil { background: var(--p-foil); } .proc-dot.holo { background: conic-gradient(#ff6a6a, #ffd84d, #4ef0a0, #4fc9ff, #b36bff, #ff6a6a); } .proc-dot.varnish { background: var(--p-varnish); } .proc-dot.emboss { background: var(--p-emboss); } .proc-dot.ink { background: var(--p-ink); }
.tabs { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); border-bottom: 1px solid var(--line); background: var(--surface-2); flex: none; }
.tabs button { border: 0; background: none; padding: 9px 4px 8px; font-size: 12px; font-weight: 600; color: var(--muted); display: grid; justify-items: center; gap: 3px; border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tabs button:hover { color: var(--ink); }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--sel); background: var(--surface); }
.tabpane { padding: 14px; display: grid; gap: 12px; overflow: auto; min-height: 0; align-content: start; flex: 1 1 auto; }
details.disc, details.acc { border-top: 1px solid var(--line); }
details.disc > summary, details.acc > summary { list-style: none; cursor: pointer; padding: 11px 0; font-family: var(--font-display); font-weight: 600; font-size: 13px; display: flex; align-items: center; gap: 8px; }
details.acc > summary { padding: 12px 14px; }
details > summary::-webkit-details-marker { display: none; }
details > summary::after { content: ""; width: 7px; height: 7px; border-right: 1.7px solid var(--muted); border-bottom: 1.7px solid var(--muted); transform: rotate(45deg); margin-left: auto; transition: transform .2s; }
details[open] > summary::after { transform: rotate(-135deg); }
details > summary .badge { margin-left: 4px; }
details .inner { display: grid; gap: 12px; padding: 0 0 14px; } details.acc .inner { padding: 0 14px 14px; }

/* stage */
.stage { position: relative; height: clamp(440px, calc(100dvh - 318px), 780px); display: grid; place-items: center; overflow: hidden; touch-action: none; color: var(--stage-ink); background-color: var(--stage); background-image: radial-gradient(var(--stage-dot) 1px, transparent 1.3px), radial-gradient(circle at 50% 38%, var(--stage-2), var(--stage) 72%); background-size: 22px 22px, 100% 100%; border-block: 1px solid var(--line); }
.stage.dropping { outline: 2px dashed var(--sel); outline-offset: -10px; }
.stage.picking { cursor: crosshair; } .stage.brushing { cursor: cell; } .stage.panning { cursor: grab; }
.stage__tag { position: absolute; left: 12px; top: 12px; z-index: 5; display: inline-flex; align-items: center; gap: 8px; padding: 6px 10px; border-radius: 8px; background: var(--stage-chip); border: 1px solid var(--stage-line); color: var(--stage-ink); font-size: 12px; font-weight: 600; backdrop-filter: blur(6px); max-width: 62%; }

.marks { position: absolute; left: calc(var(--mark-px, 0px) * -1); top: calc(var(--mark-px, 0px) * -1); width: calc(100% + 2 * var(--mark-px, 0px)); height: calc(100% + 2 * var(--mark-px, 0px)); pointer-events: none; display: none; overflow: visible; z-index: 4; transform: translateZ(3px); color: var(--stage-ink); }

.cmp-tag.l { left: 8px; } .cmp-tag.r { right: 8px; } .card.comparing .cmp-tag { display: block; }
.stage.proofing::after { content: "Épreuve papier · CMJN simulé"; position: absolute; left: 50%; bottom: 34px; transform: translateX(-50%); font-size: 11.5px; font-weight: 600; color: #fff; background: rgba(0,0,0,.66); padding: 5px 10px; border-radius: 7px; z-index: 5; pointer-events: none; white-space: nowrap; }
img { -webkit-user-drag: none; }

.stagebar { display: flex; flex-wrap: wrap; gap: 8px 10px; align-items: center; padding: 9px 12px; }

.lights button { flex: none; display: inline-flex; align-items: center; gap: 7px; border: 1px solid var(--line-2); background: var(--surface); border-radius: 8px; padding: 5px 10px 5px 7px; font-size: 12px; font-weight: 600; white-space: nowrap; color: var(--ink); }
.lights button i { width: 14px; height: 14px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #fff, var(--lamp, #ffe7b0) 62%); box-shadow: 0 0 0 1px var(--line-2); flex: none; }
.lights button:hover { border-color: var(--faint); }

/* illustrations: strip under the stage and library window */
.lib__strip { display: flex; gap: 12px; padding: 4px 14px 14px; overflow-x: auto; scrollbar-width: thin; }
.lib__fit { padding: 0 14px 14px; display: grid; gap: 10px; }
.gtile { flex: none; width: 128px; display: grid; gap: 6px; align-content: start; position: relative; min-width: 0; }
.gtile__img { position: relative; width: 100%; aspect-ratio: 5 / 7; border-radius: 9px; border: 1px solid var(--line); background: var(--surface-3) center / cover no-repeat; padding: 0; overflow: hidden; box-shadow: 0 8px 18px -12px rgba(0,0,0,.5); transition: transform .15s, box-shadow .15s; display: block; }
.gtile__img:hover { transform: translateY(-3px); box-shadow: 0 16px 26px -14px rgba(0,0,0,.6); }
.gtile[aria-selected="true"] .gtile__img { outline: 2px solid var(--sel); outline-offset: 2px; }
.gtile__tag { position: absolute; left: 6px; bottom: 6px; font-size: 10.5px; font-weight: 700; padding: 2px 7px; border-radius: 999px; background: var(--sel); color: #fff; }

.gtile__acts button { width: 27px; height: 27px; border: 0; border-radius: 7px; background: rgba(12,12,14,.74); color: #fff; display: grid; place-items: center; padding: 0; }
.gtile__acts button:hover { background: var(--sel); }
@media (hover: none) { .gtile__acts { opacity: 1; } }
.gtile.add { aspect-ratio: 5 / 7; border: 1.5px dashed var(--line-2); border-radius: 9px; background: var(--surface-2); color: var(--muted); justify-items: center; align-content: center; text-align: center; padding: 10px; cursor: pointer; gap: 4px; }
.gtile.add:hover { border-color: var(--sel); color: var(--ink); }
.gtile.add b { font-size: 12.5px; font-weight: 600; color: var(--ink); } .gtile.add span { font-size: 11px; }
.gallery__body { overflow: auto; padding: 22px clamp(16px, 4vw, 48px) 48px; display: grid; gap: 28px; align-content: start; }
.gallery__body.dropping { outline: 2px dashed var(--sel); outline-offset: -12px; }
.gallery__body section { display: grid; gap: 12px; }
.gallery__body h3 { font-size: 15px; }
.gallery__grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(176px, 1fr)); gap: 22px 18px; }
.gallery__grid .gtile { width: auto; } .gallery__grid .gtile__meta b { font-size: 13.5px; } .gallery__grid .gtile__meta span { font-size: 12px; }

/* cards of the series (atelier) and card sheet */
.cardlist { display: grid; gap: 2px; padding: 0 8px 8px; max-height: 318px; overflow: auto; }
.crow { display: grid; grid-template-columns: auto 38px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 6px 8px; border-radius: 9px; border: 1px solid transparent; background: none; text-align: left; width: 100%; cursor: pointer; }
.crow:hover { background: var(--surface-2); }
.crow[aria-selected="true"] { background: var(--sel-soft); border-color: color-mix(in srgb, var(--sel) 45%, transparent); }
.crow__num { font-size: 11.5px; font-weight: 600; color: var(--muted); width: 26px; }
.crow__th { width: 38px; aspect-ratio: var(--card-aspect, 0.716); border-radius: 3px; background: var(--surface-3) center / cover; box-shadow: 0 2px 6px -2px rgba(0,0,0,.45); }
.crow__meta { min-width: 0; display: grid; gap: 1px; }
.crow__meta b { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.crow__meta span { font-size: 11.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; gap: 6px; align-items: center; }
.crow__acts { display: flex; gap: 1px; align-items: center; }
.crow__acts button, .acts button, .ccard__acts button { width: 26px; height: 26px; border: 0; background: none; border-radius: 6px; color: var(--muted); display: grid; place-items: center; padding: 0; }
.crow__acts button:hover, .acts button:hover, .ccard__acts button:hover { background: var(--surface-3); color: var(--ink); }
.pre-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--ok); flex: none; } .pre-dot.warn { background: var(--warn); }
.procs { display: flex; flex-wrap: wrap; gap: 6px; }
.proc { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; padding: 3px 9px 3px 7px; border-radius: 999px; background: var(--surface-3); }
.pre { display: grid; gap: 6px; }
.pre div { display: flex; gap: 8px; align-items: flex-start; font-size: 12.5px; }
.pre i { width: 8px; height: 8px; border-radius: 50%; margin-top: 5px; flex: none; }
.pre .ok i { background: var(--ok); } .pre .warn i { background: var(--warn); } .pre .info i { background: var(--faint); }
.passes { margin: 0; padding-left: 20px; font-size: 12.5px; display: grid; gap: 4px; }
.passes li::marker { color: var(--faint); font-weight: 600; }

/* finishes */
.fx-search { position: relative; } .fx-search svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--faint); pointer-events: none; } .fx-search input { padding-left: 34px; }
.fxgrid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.fx { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 4px 4px 6px; display: grid; gap: 5px; text-align: left; transition: border-color .15s, transform .15s; min-width: 0; }
.fx:hover { border-color: var(--faint); transform: translateY(-1px); }

.fx-empty { grid-column: 1 / -1; padding: 18px 8px; text-align: center; color: var(--muted); font-size: 12.5px; }
.zone-tools { display: grid; gap: 10px; padding: 10px 12px; border-radius: 10px; background: var(--surface-2); border: 1px solid var(--line); }
.swatches { display: inline-flex; gap: 4px; }

.accent-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }

.accent-grid button span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.accent-grid button:hover { border-color: var(--faint); }
.accent-grid button[aria-pressed="true"] { border-color: var(--sel); background: var(--sel-soft); }
.accent-grid .dot { width: 14px; height: 14px; border-radius: 50%; flex: none; box-shadow: 0 0 0 1px var(--line-2); }
/* layers */
.layer-list { display: grid; gap: 3px; }
.layer-row { display: grid; grid-template-columns: 36px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 5px 6px; border-radius: 9px; border: 1px solid transparent; cursor: pointer; }
.layer-row:hover { background: var(--surface-2); }
.layer-row[aria-selected="true"] { background: var(--sel-soft); border-color: color-mix(in srgb, var(--sel) 45%, transparent); }
.layer-row.off { opacity: .55; } .layer-row.dragging { opacity: .4; } .layer-row.over { box-shadow: 0 -2px 0 var(--sel); }
.layer-row .th { width: 36px; height: 36px; border-radius: 7px; background: var(--surface-3) center / cover; display: grid; place-items: center; font-size: 11px; font-weight: 700; color: var(--muted); }
.meta2 { min-width: 0; display: grid; } .meta2 b { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; } .meta2 span { font-size: 11.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.acts { display: flex; gap: 1px; }
.backs { display: grid; grid-template-columns: repeat(auto-fill, minmax(64px, 1fr)); gap: 8px; }
.backs button { display: grid; gap: 4px; justify-items: center; background: none; border: 0; padding: 4px; color: var(--muted); font-size: 11px; }
.backs canvas { width: 52px; aspect-ratio: var(--card-aspect, 0.716); border-radius: 5%/3.6%; display: block; box-shadow: 0 6px 14px -6px rgba(0,0,0,.6); }
.backs button[aria-pressed="true"] canvas { outline: 2px solid var(--sel); outline-offset: 2px; }
/* formats */
.formats { display: grid; gap: 3px; max-height: 330px; overflow: auto; }
.format-row { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 6px 8px; border: 1px solid transparent; border-radius: 9px; background: none; text-align: left; }
.format-row:hover { background: var(--surface-2); }
.format-row[aria-pressed="true"] { border-color: var(--sel); background: var(--sel-soft); }
.format-row .shape { width: 22px; justify-self: center; background: var(--surface-3); border: 1.5px solid var(--faint); border-radius: 3px; }
.format-row[aria-pressed="true"] .shape { border-color: var(--sel); background: var(--surface); }
.format-row b { font-size: 13px; font-weight: 600; display: block; } .format-row span { font-size: 11.5px; color: var(--muted); }
.format-row .dim { font-size: 11.5px; color: var(--muted); white-space: nowrap; font-weight: 600; }

/* series */
.contact { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px; padding: 0 14px 14px; }
.ccard { display: grid; gap: 6px; padding: 8px; border-radius: 11px; border: 1px solid transparent; }
.ccard[aria-selected="true"] { background: var(--sel-soft); border-color: color-mix(in srgb, var(--sel) 45%, transparent); }
.ccard__img { position: relative; border: 0; padding: 0; background: var(--surface-3); border-radius: 6px; aspect-ratio: var(--card-aspect, 0.716); overflow: hidden; box-shadow: 0 10px 22px -12px rgba(0,0,0,.55); display: block; width: 100%; transition: transform .15s; }
.ccard__img:hover { transform: translateY(-2px); }
.ccard__img img { width: 100%; height: 100%; object-fit: cover; display: block; }
.ccard__num { position: absolute; left: 6px; top: 6px; font-size: 11px; font-weight: 700; background: rgba(0,0,0,.62); color: #fff; padding: 1px 6px; border-radius: 5px; }
.ccard__pre { position: absolute; right: 7px; top: 7px; width: 10px; height: 10px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 2px rgba(255,255,255,.85); } .ccard__pre.warn { background: var(--warn); }
.ccard__meta { display: grid; min-width: 0; } .ccard__meta b { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; } .ccard__meta span { font-size: 11.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ccard__acts { display: flex; gap: 1px; }
.ccard.add .ccard__img { display: grid; place-items: center; background: var(--surface-2); border: 1.5px dashed var(--line-2); box-shadow: none; color: var(--muted); font-weight: 600; font-size: 12.5px; }
.imp-preview { border: 1px solid var(--line); border-radius: 10px; background: var(--surface-2); padding: 12px; display: grid; place-items: center; }
.imp-preview svg { max-width: 100%; max-height: 230px; height: auto; display: block; box-shadow: 0 6px 16px -10px rgba(0,0,0,.5); }

/* dielines */
.plans { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 16px; align-items: start; }
.sheet { background-color: #faf9f4; background-image: repeating-linear-gradient(0deg, transparent 0 19px, rgba(0,0,0,.045) 19px 20px), repeating-linear-gradient(90deg, transparent 0 19px, rgba(0,0,0,.045) 19px 20px); padding: 26px; display: grid; place-items: center; min-height: 500px; border-block: 1px solid var(--line); }
.sheet svg { max-width: 100%; height: auto; max-height: 70vh; border-radius: 6px; box-shadow: 0 16px 40px -18px rgba(0,0,0,.4); }
.sheet__foot { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; padding: 10px 14px; font-size: 12px; color: var(--muted); align-items: center; }
.bignum { font-family: var(--font-display); font-weight: 600; font-size: 24px; letter-spacing: -0.02em; }

/* mockups */
.mock__stage { position: relative; height: clamp(440px, calc(100dvh - 300px), 800px); background: var(--stage); border-block: 1px solid var(--line); overflow: hidden; touch-action: none; cursor: grab; color: var(--stage-ink); }
.mock__stage.grabbing { cursor: grabbing; }
